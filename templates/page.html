<style>
/* 宅配食・ミールキット比較ナビ
   「台所の食卓、夜8時」——温めるだけの食事を選ぶ人のための、静かな比較読み物。
   暖かい紙の地色と墨色の本文＝温めた食事、ひとつだけの冷たい常磐色（ときわ）＝
   冷凍のコールドチェーンと、リンク・表・CTA などの操作/構造。
   見出しは明朝（編集部が確かめて選んでいる、という手仕事の含み）、本文はゴシック。 */

:root {
  --paper:    #f4f2ea;   /* 暖かい紙の白 */
  --paper-2:  #efece2;   /* ひとつ沈めた紙（ヘッダー/フッター） */
  --tint:     #e9e3d3;   /* 味噌/麦のうすい面（表の縞・目次・CTA） */
  --line:     #d6cebb;   /* 罫線 */
  --ink:      #2f271d;   /* 墨色（やや茶を含む） */
  --ink-soft: #6a5f4f;   /* 副次テキスト */
  --accent:   #1d5b54;   /* 常磐色（冷凍・操作・構造） */
  --accent-2: #123f3a;   /* hover/active */
  --warn:     #955521;   /* 広告表示ラベルのみに使う焦げ茶 */
  --wrap: 42rem;
  --gutter: 20px;
  --mincho: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", "BIZ UDPMincho", "Noto Serif JP", serif;
  --gothic: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--gothic);
  font-size: 16px;
  line-height: 1.85;
  line-break: strict;
  font-feature-settings: "palt" 0;
  text-spacing-trim: space-first;
}

/* ---- 帯（サイト名だけ） ---- */
.site-header {
  border-bottom: 1px solid var(--line);
  background: var(--paper-2);
}
.site-title {
  display: block;
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 13px var(--gutter);
  font-family: var(--mincho);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
  text-decoration: none;
}
.site-title:hover { color: var(--accent); }

/* ---- 本文の器 ---- */
main {
  display: block;
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 44px var(--gutter) 80px;
}

/* ---- 見出し ---- */
h1 {
  font-family: var(--mincho);
  font-weight: 700;
  font-size: clamp(1.7rem, 1.36rem + 1.7vw, 2.2rem);
  line-height: 1.44;
  letter-spacing: 0.01em;
  margin: 0 0 0.7em;
  line-break: strict;
  overflow-wrap: anywhere;
  text-wrap: pretty;
}
h2 {
  font-family: var(--mincho);
  font-weight: 700;
  font-size: 1.42rem;
  line-height: 1.5;
  letter-spacing: 0.01em;
  margin: 2.9em 0 1em;
  padding-bottom: 0.35em;
  border-bottom: 1px solid var(--line);
}
h2::before {
  content: "";
  display: inline-block;
  width: 0.5em;
  height: 0.5em;
  margin-right: 0.6em;
  background: var(--accent);
  vertical-align: 0.08em;
}
h3 {
  font-weight: 700;
  font-size: 1.08rem;
  line-height: 1.6;
  margin: 2.1em 0 0.6em;
}
h2[id], h3[id] { scroll-margin-top: 20px; }

p { margin: 1.1em 0; }
strong { font-weight: 700; color: var(--ink); }

ul, ol { margin: 1.1em 0; padding-left: 1.4em; }
li { margin: 0.5em 0; }
li::marker { color: var(--accent); }

blockquote {
  margin: 1.9em 0;
  padding: 0.1em 0 0.1em 1.1em;
  border-left: 3px solid var(--line);
  color: var(--ink-soft);
  font-size: 0.95rem;
}
blockquote p { margin: 0.6em 0; }

/* ---- リンク ---- */
a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  text-decoration-color: color-mix(in srgb, var(--accent) 38%, transparent);
  transition: color 0.12s ease, text-decoration-color 0.12s ease;
}
a:hover { color: var(--accent-2); text-decoration-color: currentColor; }

:where(a, button, summary):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 1px;
}

img { max-width: 100%; height: auto; }

/* ---- 記事メタ / パンくず ---- */
.meta {
  color: var(--ink-soft);
  font-size: 0.8rem;
  line-height: 1.7;
  margin: 0.4em 0 0;
}
.breadcrumb {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-bottom: 1.4em;
}
.breadcrumb a { color: var(--ink-soft); text-decoration: none; }
.breadcrumb a:hover { color: var(--accent); text-decoration: underline; }

/* ---- 広告表示ラベル ---- */
.pr-notice {
  display: inline-block;
  margin: 0.5em 0 1.6em;
  padding: 0.12em 0.6em;
  font-size: 0.76rem;
  color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 34%, var(--line));
  border-radius: 2px;
}

/* ---- 目次 ---- */
.toc {
  background: var(--tint);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 15px 20px 16px;
  margin: 1.9em 0 2.6em;
  font-size: 0.9rem;
}
.toc-title {
  font-family: var(--mincho);
  font-weight: 700;
  color: var(--ink);
  margin: 0 0 0.5em;
}
.toc ol { margin: 0; padding-left: 1.4em; }
.toc li { margin: 0.3em 0; }
.toc a { color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--accent); text-decoration: underline; }

/* ---- 表 ---- */
.table-wrap {
  overflow-x: auto;
  margin: 1.7em 0;
  border: 1px solid var(--line);
  border-radius: 2px;
  -webkit-overflow-scrolling: touch;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.92rem;
  line-height: 1.7;
}
th, td {
  padding: 10px 13px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line);
}
thead th {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  white-space: nowrap;
}
tbody tr:nth-child(even) { background: var(--tint); }
tbody tr:last-child td { border-bottom: 0; }
@media (max-width: 480px) {
  th, td { padding: 8px 10px; }
  table { font-size: 0.85rem; }
}

/* ---- こんな人向けバッジ ---- */
.badge {
  display: inline-block;
  padding: 0.15em 0.55em;
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1.6;
  color: #fff;
  background: var(--accent);
  border-radius: 2px;
  white-space: nowrap;
}
.badge.alt { background: var(--warn); }

/* ---- CTA（アフィリエイト訴求）---- */
.aff-box {
  margin: 2.1em 0;
  padding: 18px 20px 20px;
  background: var(--tint);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
  font-size: 0.95rem;
}
.aff-box > strong {
  display: block;
  margin-bottom: 0.4em;
  font-family: var(--mincho);
  font-size: 1.05rem;
  color: var(--ink);
}
.aff-box a {
  text-decoration: none;
  transition: background-color 0.12s ease, color 0.12s ease;
}
.aff-box a:not(:has(img)) {
  display: inline-block;
  margin-top: 0.7em;
  padding: 0.66em 1.15em;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  border-radius: 2px;
}
.aff-box a:not(:has(img)):hover { background: var(--accent-2); color: #fff; }
.aff-box a:has(img) { display: inline-block; margin-top: 0.8em; }
.aff-box img { border-radius: 2px; display: block; }

/* ---- 関連記事 ---- */
.related-articles {
  margin: 3.2em 0 0;
  padding-top: 1em;
  border-top: 2px solid var(--ink);
}
.related-title {
  font-family: var(--mincho);
  font-weight: 700;
  color: var(--ink);
  margin: 0 0 0.5em;
  font-size: 1rem;
}
.related-articles ul { margin: 0; padding-left: 1.3em; }
.related-articles li { margin: 0.4em 0; }
.related-articles a { color: var(--ink); text-decoration: none; }
.related-articles a:hover { color: var(--accent); text-decoration: underline; }

/* ---- トップページ：リード＋目的ナビ＋記事索引 ---- */
.lede {
  font-size: 1.02rem;
  color: var(--ink-soft);
  line-height: 1.95;
  margin: 0 0 2.4em;
}
.purpose-nav { margin: 0 0 3em; }
.purpose-nav-label {
  margin: 0 0 0.7em;
  font-size: 0.82rem;
  color: var(--ink-soft);
}
.purpose-nav ul {
  display: flex;
  flex-wrap: wrap;
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}
.purpose-nav li { margin: 0; flex: 1 1 7em; min-width: 6em; }
.purpose-nav a {
  display: block;
  padding: 0.85em 0.7em;
  text-align: center;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-size: 0.95rem;
  transition: background-color 0.12s ease, color 0.12s ease;
}
.purpose-nav a:hover { background: var(--accent); color: #fff; }

.article-list { margin: 0; padding: 0; list-style: none; }
.article-list li {
  margin: 0;
  padding: 16px 0;
  border-top: 1px solid var(--line);
}
.article-list li:last-child { border-bottom: 1px solid var(--line); }
.article-list a {
  font-family: var(--mincho);
  font-size: 1.12rem;
  font-weight: 700;
  color: var(--ink);
  text-decoration: none;
  line-height: 1.55;
}
.article-list a:hover { color: var(--accent); text-decoration: underline; }
.article-list p {
  margin: 0.4em 0 0;
  color: var(--ink-soft);
  font-size: 0.9rem;
  line-height: 1.7;
}
.article-list .meta { margin-top: 0.55em; }

/* ---- フッター ---- */
.site-footer {
  border-top: 1px solid var(--line);
  background: var(--paper-2);
  color: var(--ink-soft);
  font-size: 0.8rem;
  line-height: 1.8;
  padding-block: 30px;
}
.site-footer > * {
  max-width: var(--wrap);
  margin: 0 auto;
  padding-inline: var(--gutter);
}
.site-footer .disclosure { margin-bottom: 0.7em; }
.footer-nav a { color: var(--ink-soft); text-decoration: none; margin-right: 0.9em; }
.footer-nav a:hover { color: var(--accent); text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
